name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Verify package contents
        run: npm pack --dry-run
